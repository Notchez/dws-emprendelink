name: Pruebas de Laravel

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Validar Laravel y frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_solo_ci
          MYSQL_DATABASE: emprendelink_testing
          MYSQL_USER: emprendelink_ci
          MYSQL_PASSWORD: password_solo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_solo_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: emprendelink_testing
      DB_USERNAME: emprendelink_ci
      DB_PASSWORD: password_solo_ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_mysql, dom, xml, curl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Configurar npm
        run: npm install --global npm@12

      - name: Validar archivos de Composer
        run: composer validate --strict

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Auditar dependencias PHP
        run: composer audit

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Preparar la aplicacion
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Ejecutar migraciones en MySQL
        run: php artisan migrate --force

      - name: Ejecutar pruebas
        run: php artisan test
